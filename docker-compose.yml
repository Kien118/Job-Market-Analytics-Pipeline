services:
  postgres:
    image: postgres:16
    container_name: job_market_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DASHBOARD_DB_PASSWORD: ${DASHBOARD_DB_PASSWORD:-}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - job_market_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: job_market_backend
    restart: always
    env_file:
      - .env
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - job_market_network

  metabase:
    image: metabase/metabase:latest
    container_name: job_market_metabase
    restart: always
    profiles: ["metabase"]
    ports:
      - "127.0.0.1:${METABASE_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - job_market_network

  streamlit:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: job_market_streamlit
    restart: always
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: job_market_dashboard
      POSTGRES_PASSWORD: ${DASHBOARD_DB_PASSWORD:-}
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - job_market_network

  etl:
    build: ./etl
    profiles: ["etl"]
    command: ["python", "scheduler.py"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      INGEST_SOURCES: ${INGEST_SOURCES:-careerviet,topdev,arbeitnow}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - job_market_network

volumes:
  postgres_data:

networks:
  job_market_network:
    driver: bridge
