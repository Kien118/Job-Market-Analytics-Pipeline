name: job-market-airflow

x-airflow: &airflow
  build:
    context: .
    dockerfile: orchestration/Dockerfile
  image: job-market-airflow:3.2.2
  environment: &airflow-env
    AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:?Set AIRFLOW_DB_PASSWORD for Airflow}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN_CMD: >-
      python -c 'import os; from urllib.parse import quote;
      print("postgresql+psycopg2://airflow:" + quote(os.environ["AIRFLOW_DB_PASSWORD"], safe="") + "@airflow-metadata/airflow", end="")'
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__PARALLELISM: "4"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api:8080/execution/
    AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/auth/passwords.json
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?Set AIRFLOW_JWT_SECRET for Airflow}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__API__WORKERS: "1"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW__DAG_PROCESSOR__PARSING_PROCESSES: "1"
  volumes:
    - airflow_logs:/opt/airflow/logs
  networks:
    - airflow_network

services:
  airflow-metadata:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_DB: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?Set AIRFLOW_DB_PASSWORD for Airflow}
    volumes:
      - airflow_metadata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "airflow", "-d", "airflow"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - airflow_network

  airflow-init:
    <<: *airflow
    depends_on:
      airflow-metadata:
        condition: service_healthy
    environment:
      <<: *airflow-env
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?Set AIRFLOW_ADMIN_PASSWORD for Airflow}
    volumes:
      - airflow_auth:/opt/airflow/auth
    command:
      - bash
      - -ec
      - |
        umask 077
        python -c 'import json, os; from pathlib import Path; Path(os.environ["AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE"]).write_text(json.dumps({"admin": os.environ["AIRFLOW_ADMIN_PASSWORD"]}), encoding="utf-8")'
        exec airflow db migrate

  airflow-api:
    <<: *airflow
    command: api-server
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8081}:8080"
    volumes:
      - airflow_logs:/opt/airflow/logs
      # SimpleAuth opens the password file in read/write mode even when the user already exists.
      - airflow_auth:/opt/airflow/auth
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  airflow-scheduler:
    <<: *airflow
    command: scheduler
    depends_on:
      airflow-api:
        condition: service_healthy
    environment:
      <<: *airflow-env
      DATABASE_URL: ${DATABASE_URL:?Set the job-market DATABASE_URL for Airflow tasks}
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - airflow_network
      - job_market_network

  airflow-dag-processor:
    <<: *airflow
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "DagProcessorJob", "--local"]
      interval: 15s
      timeout: 10s
      retries: 12

volumes:
  airflow_metadata:
  airflow_auth:
  airflow_logs:

networks:
  airflow_network:
  job_market_network:
    external: true
    name: ${AIRFLOW_JOB_NETWORK:-job-market-analytics_job_market_network}
