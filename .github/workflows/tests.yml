name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/job_market_test
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r etl/requirement.txt -r dashboard/requirements.txt
      - name: Start the test database
        run: |
          sed 's/job_market_db/job_market_test/g' .env.example > .env
          docker compose up -d --wait postgres
      - run: python -m unittest discover -s tests -v
      - run: docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U postgres -d job_market_test < tests/test_identity.sql
